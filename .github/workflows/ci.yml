name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: CI / rápido
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      db: ${{ steps.impact.outputs.db }}
      ui: ${{ steps.impact.outputs.ui }}
      mutations: ${{ steps.impact.outputs.mutations }}
      prototipo: ${{ steps.impact.outputs.prototipo }}
      prototipo_paso: ${{ steps.prototipo.outcome }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-pruebas.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-solo-para-pruebas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/impact.mjs
      - run: npm ci
      - run: node --test scripts/ci/impact.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx playwright test --config=playwright.pure.config.ts
      - run: npm run build
      # Normalmente tarda ~20 s. Si el mirror de apt se cuelga (visto en EPT-113), el plazo evita agotar
      # los 8 min del job y cae a instalar solo el navegador: las librerías de sistema ya vienen en la imagen.
      - name: Instalar Chromium
        run: timeout 150 npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npx playwright test --config=playwright.smoke.config.ts
      # Prototipo EPT-96: contiene HTML/CSS/JS ejecutable; se recorre en Chromium real, no solo se verifican hashes.
      - name: Prototipo EPT-96 (navegación real)
        id: prototipo
        if: steps.impact.outputs.prototipo == 'true'
        timeout-minutes: 5
        run: node docs/parte3/EPT-96/pruebas/prototipo.mjs
  database:
    name: CI / contratos reales
    needs: fast
    if: needs.fast.outputs.db == 'true'
    uses: ./.github/workflows/local-tests.yml
    with:
      kind: db
      mutations: ${{ needs.fast.outputs.mutations == 'true' }}
  ui:
    name: CI / interfaz focal
    needs: fast
    if: needs.fast.outputs.ui != '[]' && needs.fast.outputs.ui != ''
    uses: ./.github/workflows/local-tests.yml
    with:
      kind: ui
      selection: ${{ needs.fast.outputs.ui }}
  # --- App móvil (EPT-102 + EPT-105) ---------------------------------------------------------------
  # El plan decide si el cambio toca `mobile/` o lo que la app copia de la web. Un PASS de Next web no prueba mobile:
  # con plan móvil el gate exige JS (tipos, lint, pruebas, bundles), build Android + ejecución en emulador y build iOS +
  # ejecución en simulador sobre el SHA exacto del PR.
  plan:
    name: CI / plan móvil
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.impact.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/impact.mjs
  mobile:
    name: CI / móvil
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder-pruebas.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-solo-para-pruebas
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalación reproducible
        run: npm ci
      - name: Copia compartida sin deriva
        run: npm run compartido:check
      - name: Importaciones prohibidas y secretos
        run: npm run verificar:importaciones
      - name: Compatibilidad Expo
        run: npm run verificar:expo && npm run doctor
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Componentes, formulario, sesión, almacenamiento y transporte
        run: npm test
      - name: Bundle Android
        run: npm run bundle:android
      - name: Bundle iOS
        run: npm run bundle:ios
      - name: Aislamiento de los bundles exportados
        run: node scripts/verificar-importaciones.mjs --bundle dist/android --bundle dist/ios
  mobile-android:
    name: CI / móvil Android
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # Medido: el recorrido completo tarda 1567–1752 s; con 30 min un runner lento agotaba el plazo en el último flujo.
    timeout-minutes: 40
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      CI: '1'
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            package-lock.json
      - name: Presupuesto y progreso nativo
        run: |
          echo "EPT_NATIVE_DEADLINE=$(( $(date +%s) + 2280 ))" >> "$GITHUB_ENV"
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-movil-android/stages" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas de deadlines y descendientes
        run: |
          python3 scripts/ci/run-stage.test.py
          node --test mobile/scripts/stack-isolation.test.mjs
      - name: Instalar CLI Supabase aislada (2.117.0)
        run: python3 scripts/ci/run-stage.py --stage cli-install --seconds 90 -- bash scripts/ci/install-cli.sh --isolated
      - name: Iniciar proyecto Supabase local descartable
        run: node mobile/scripts/supabase-local.mjs start android
      # EPT-109: la finalización de un comprobante vive en una ruta de Next. Se levanta el mismo código
      # contra el stack efímero para probarla de verdad desde el script de integración y desde el emulador.
      - name: Dependencias web para el servidor local
        run: python3 scripts/ci/run-stage.py --stage web-deps --seconds 150 -- npm ci
      - name: Iniciar servidor web local
        run: python3 scripts/ci/run-stage.py --stage web-server --seconds 150 -- node mobile/scripts/servidor-web-local.mjs start
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Instalación y proyecto nativo
        working-directory: mobile
        run: |
          python3 ../scripts/ci/run-stage.py --stage android-deps --seconds 180 -- npm ci
          python3 ../scripts/ci/run-stage.py --stage android-prebuild --seconds 90 -- npx --no-install expo prebuild --platform android --no-install
      - name: Preparar NDK declarado, adquisición SDK aislada
        run: python3 scripts/ci/run-stage.py --stage android-sdk-ndk --seconds 220 -- node mobile/scripts/android-imagen.mjs ndk
      - name: Build Android (release de prueba, x86_64)
        working-directory: mobile/android
        run: |
          start=$(date +%s)
          python3 ../../scripts/ci/run-stage.py --stage android-build --seconds 720 -- ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace
          echo "duracion_build_segundos=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Localizar APK
        id: apk
        run: |
          apk=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "ruta=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Instalar Maestro 2.11.0
        run: |
          curl --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Verificar Auth, roles, expiración y RLS con actores sintéticos
        run: python3 scripts/ci/run-stage.py --stage auth-integration --seconds 210 -- node mobile/scripts/integracion-auth-local.mjs
      # EPT-106: recuperación y cambio de contraseña con GoTrue y Mailpit reales (solicitud, correo, enlace,
      # canje PKCE, cambio, login y rechazo de la anterior). También prepara el actor del escenario del emulador.
      - name: Verificar recuperación de contraseña con correo real
        run: python3 scripts/ci/run-stage.py --stage recovery-integration --seconds 150 -- node --experimental-strip-types --no-warnings mobile/scripts/integracion-recuperacion.mjs
      # EPT-119: ciclo económico conectado. La app registra pagos y comprobantes; Dirección decide desde la web real
      # (Chromium) sobre los mismos registros; la app y los informes se reconcilian con importes esperados fijos.
      - name: Preparar el ciclo económico conectado (Android)
        run: |
          echo "EPT_CICLO_CLAVE=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-android" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          timeout 150 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Fixture del ciclo económico (Android)
        run: python3 scripts/ci/run-stage.py --stage ciclo-preparar --seconds 90 -- node mobile/scripts/ciclo-economico.mjs preparar android
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Preparar imagen SDK verificada, descarga aislada
        run: python3 scripts/ci/run-stage.py --stage android-sdk-image --seconds 220 -- node mobile/scripts/android-imagen.mjs
      - name: Ejecutar en emulador Android (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/ejecutar-android.sh ${{ steps.apk.outputs.ruta }}
      - name: Resumir el log de autenticación (diagnóstico)
        if: always()
        run: node mobile/scripts/supabase-local.mjs logs-auth "$RUNNER_TEMP/evidencia-movil-android/stages/auth-resumen.txt" || true
      - name: Detener el servidor web local
        if: always()
        run: node mobile/scripts/servidor-web-local.mjs stop
      - name: Detener el stack local de pruebas
        if: always()
        run: node mobile/scripts/supabase-local.mjs stop
      - name: Sanear artifacts nativos
        id: sanear_android
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-movil-android"
      - name: Subir evidencia Android
        if: always() && steps.sanear_android.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movil-android-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.ruta }}
            ${{ runner.temp }}/evidencia-movil-android/stages/
            ${{ runner.temp }}/evidencia-movil-android/sdk-imagen/
            ${{ runner.temp }}/evidencia-movil-android/sdk-ndk/
            ${{ runner.temp }}/evidencia-movil-android/android-version.txt
            ${{ runner.temp }}/evidencia-movil-android/maestro-android/
            ${{ runner.temp }}/evidencia-movil-android/maestro-comprobante/
            ${{ runner.temp }}/evidencia-movil-android/maestro-consultas/
            ${{ runner.temp }}/evidencia-movil-android/maestro-consultas-estudiante/
            ${{ runner.temp }}/evidencia-movil-android/maestro-deuda/
            ${{ runner.temp }}/evidencia-movil-android/maestro-recibos/
            ${{ runner.temp }}/evidencia-movil-android/maestro-ciclo-pago/
            ${{ runner.temp }}/evidencia-movil-android/maestro-ciclo-estado/
            ${{ runner.temp }}/evidencia-movil-android/maestro-recuperacion-solicitud/
            ${{ runner.temp }}/evidencia-movil-android/maestro-recuperacion-cambio/
          if-no-files-found: warn
          retention-days: 14
  # EPT-119: los runners macOS ARM no tienen Docker, así que el backend de prueba (Supabase local + Next + Chromium de
  # Dirección) corre en este job Linux y el simulador iOS lo alcanza por HTTPS mediante túneles efímeros (URL aleatoria,
  # datos sintéticos, solo la clave anónima viaja). Ambos jobs se coordinan con el estado real del backend y con dos
  # artefactos: `ios-apreton` (URLs públicas) e `ios-fin` (el simulador terminó). El stack se destruye siempre.
  mobile-ios-backend:
    name: CI / backend de prueba para iOS
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CI: '1'
      EPT_CICLO_ESPERA_APP_MS: '2400000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            package-lock.json
      - name: Clave común del ciclo y presupuesto
        run: |
          echo "EPT_CICLO_CLAVE=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-ios" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "EPT_NATIVE_DEADLINE=$(( $(date +%s) + 3300 ))" >> "$GITHUB_ENV"
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-backend-ios/stages" >> "$GITHUB_ENV"
      - name: Instalar CLI Supabase aislada (2.117.0)
        run: python3 scripts/ci/run-stage.py --stage cli-install --seconds 90 -- bash scripts/ci/install-cli.sh --isolated
      - name: Iniciar proyecto Supabase local descartable
        run: node mobile/scripts/supabase-local.mjs start ios
      - name: Dependencias web y Chromium
        run: |
          python3 scripts/ci/run-stage.py --stage web-deps --seconds 150 -- npm ci
          timeout 150 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Iniciar servidor web local
        run: python3 scripts/ci/run-stage.py --stage web-server --seconds 150 -- node mobile/scripts/servidor-web-local.mjs start
      # cloudflared fijado por versión y verificado por SHA-256 (resumen publicado por GitHub para ese recurso).
      - name: Instalar cloudflared 2026.10.1
        run: |
          curl --connect-timeout 10 --max-time 120 -fsSL -o "$RUNNER_TEMP/cloudflared" https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64
          echo "3bfc539f45d2620c71debb7a86be0efa737ed5ccbad9eb85c787116900e5c586  $RUNNER_TEMP/cloudflared" | sha256sum -c -
          chmod 0700 "$RUNNER_TEMP/cloudflared"
          echo "EPT_CLOUDFLARED=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"
      - name: Fixture del ciclo económico (iOS)
        run: python3 scripts/ci/run-stage.py --stage ciclo-preparar --seconds 90 -- node mobile/scripts/ciclo-economico.mjs preparar ios
      - name: Abrir túneles efímeros
        run: node mobile/scripts/tunel-efimero.mjs start "$RUNNER_TEMP/tunel"
      - name: Publicar apretón de manos (solo URLs públicas y clave anónima)
        run: |
          mkdir -p "$RUNNER_TEMP/apreton"
          node mobile/scripts/ciclo-economico.mjs publicar ios "$RUNNER_TEMP/tunel/urls.json" "$RUNNER_TEMP/apreton/apreton.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-apreton-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apreton/apreton.json
          retention-days: 1
      - name: Dirección decide desde la web los pagos que registre la app iOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: node mobile/scripts/ciclo-economico.mjs decidir ios
      - name: Conciliar estados, saldos, recibo e informes
        run: python3 scripts/ci/run-stage.py --stage ciclo-verificar --seconds 150 -- node mobile/scripts/ciclo-economico.mjs verificar ios
      # El simulador sigue leyendo el backend por el túnel: no se destruye hasta que avise que terminó.
      - name: Esperar a que el simulador iOS termine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nombre="ios-fin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for _ in $(seq 1 120); do
            total=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq "[.artifacts[] | select(.name == \"${nombre}\")] | length")
            if [ "$total" -ge 1 ]; then echo "El simulador iOS avisó que terminó."; exit 0; fi
            sleep 10
          done
          echo "El simulador iOS no avisó su finalización a tiempo." >&2
          exit 1
      - name: Resumir el log de autenticación (diagnóstico)
        if: always()
        run: node mobile/scripts/supabase-local.mjs logs-auth "$RUNNER_TEMP/evidencia-backend-ios/auth-resumen.txt" || true
      - name: Detener túneles, servidor web y stack
        if: always()
        run: |
          node mobile/scripts/tunel-efimero.mjs stop "$RUNNER_TEMP/tunel" || true
          node mobile/scripts/servidor-web-local.mjs stop || true
          node mobile/scripts/supabase-local.mjs stop || true
      - name: Sanear diagnóstico del backend
        id: sanear_backend
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidencia-backend-ios"
          cp -r "$EPT_STAGE_LOG_DIR" "$RUNNER_TEMP/evidencia-backend-ios/" 2>/dev/null || true
          python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-backend-ios"
      - name: Subir diagnóstico del backend
        if: always() && steps.sanear_backend.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-ios-${{ github.sha }}
          path: ${{ runner.temp }}/evidencia-backend-ios/
          if-no-files-found: warn
          retention-days: 14
  mobile-ios:
    name: CI / móvil iOS
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    # iOS corre el recorrido económico real contra el backend del job `mobile-ios-backend` (ver arriba) y conserva el
    # smoke sin backend (acceso, recuperación y compartir PDF nativo).
    env:
      CI: '1'
      EPT_MOBILE_RECIBOS_NATIVE_QA: '1'
      EPT_CICLO_IOS: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Versiones de herramientas
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          node --version
      - name: Clave común del ciclo
        run: echo "EPT_CICLO_CLAVE=$(printf '%s' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA-ios" | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Instalación y proyecto nativo (incluye pods)
        working-directory: mobile
        # El prebuild no depende del backend: corre mientras el job Linux prepara Supabase, Next y los túneles.
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder-pruebas.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-solo-para-pruebas
          EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
        run: |
          npm ci
          npx --no-install expo prebuild --platform ios
      # Las URL públicas se incrustan en el bundle durante el build: se esperan aquí, ya con el prebuild hecho.
      - name: Esperar el backend de prueba (túnel efímero)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          destino="$RUNNER_TEMP/apreton"
          for _ in $(seq 1 90); do
            # Si el backend ya falló no tiene sentido esperar su apretón de manos.
            falla=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq "[.jobs[] | select(.name == \"CI / backend de prueba para iOS\" and .conclusion == \"failure\")] | length" 2>/dev/null || echo 0)
            if [ "$falla" -ge 1 ]; then echo "El backend de prueba falló: no habrá apretón de manos." >&2; exit 1; fi
            if gh run download "$GITHUB_RUN_ID" -n "ios-apreton-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -D "$destino" 2>/dev/null && [ -f "$destino/apreton.json" ]; then break; fi
            sleep 10
          done
          test -f "$destino/apreton.json"
          node mobile/scripts/tunel-efimero.mjs entorno "$destino/apreton.json"
          node mobile/scripts/ciclo-economico.mjs entorno ios "$destino/apreton.json"
      - name: Build iOS para simulador (release de prueba, sin firma, arm64)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          start=$(date +%s)
          workspace=$(ls -d *.xcworkspace | head -n 1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64             -derivedDataPath "$RUNNER_TEMP/derived"             CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM= build             > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/xcodebuild.log"
          echo "duracion_build_segundos=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Localizar aplicación
        id: app
        run: |
          app=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app"
          echo "ruta=$app" >> "$GITHUB_OUTPUT"
      - name: Instalar Maestro 2.11.0
        run: |
          curl --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Ejecutar smoke en simulador iOS (sin backend)
        timeout-minutes: 20
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: bash mobile/scripts/ejecutar-ios.sh "${{ steps.app.outputs.ruta }}"
      - name: Ejecutar ciclo económico conectado en simulador iOS
        timeout-minutes: 30
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: bash mobile/scripts/ejecutar-ios-ciclo.sh "${{ steps.app.outputs.ruta }}"
      # El job Linux mantiene el backend vivo hasta ver este artefacto (siempre se sube, aunque el ciclo falle).
      - name: Avisar al backend que el simulador terminó
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fin"
          echo "terminado" > "$RUNNER_TEMP/fin/fin.txt"
      - name: Subir aviso de finalización
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-fin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fin/fin.txt
          retention-days: 1
      - name: Empaquetar evidencia iOS
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidencia-movil-ios"
          if [ -n "${{ steps.app.outputs.ruta }}" ]; then ditto -c -k --keepParent "${{ steps.app.outputs.ruta }}" "$RUNNER_TEMP/evidencia-movil-ios/aplicacion-ios-simulador.zip"; fi
          cp "$RUNNER_TEMP/xcodebuild.log" "$RUNNER_TEMP/evidencia-movil-ios/xcodebuild.log" || true
          node mobile/scripts/diagnostico-ios.mjs || true
      - name: Sanear artifacts iOS
        id: sanear_ios
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-movil-ios"
      - name: Subir evidencia iOS
        if: always() && steps.sanear_ios.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movil-ios-${{ github.sha }}
          path: ${{ runner.temp }}/evidencia-movil-ios/
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: CI / gate
    if: always()
    needs: [fast, database, ui, plan, mobile, mobile-android, mobile-ios, mobile-ios-backend]
    runs-on: ubuntu-latest
    steps:
      - env:
          FAST: ${{ needs.fast.result }}
          DATABASE: ${{ needs.database.result }}
          UI: ${{ needs.ui.result }}
          PLAN_DB: ${{ needs.fast.outputs.db }}
          PLAN_UI: ${{ needs.fast.outputs.ui }}
          PLAN_MUTATIONS: ${{ needs.fast.outputs.mutations }}
          PLAN_PROTOTIPO: ${{ needs.fast.outputs.prototipo }}
          PASO_PROTOTIPO: ${{ needs.fast.outputs.prototipo_paso }}
          PLAN: ${{ needs.plan.result }}
          PLAN_MOBILE: ${{ needs.plan.outputs.mobile }}
          MOBILE: ${{ needs.mobile.result }}
          ANDROID: ${{ needs.mobile-android.result }}
          IOS: ${{ needs.mobile-ios.result }}
          IOS_BACKEND: ${{ needs.mobile-ios-backend.result }}
        run: |
          test "$FAST" = success
          case "$PLAN_MUTATIONS" in true|false) ;; *) exit 1 ;; esac
          case "$PLAN_DB" in
            true) test "$DATABASE" = success ;;
            false) test "$DATABASE" = skipped ;;
            *) exit 1 ;;
          esac
          # El prototipo EPT-96 se recorre en Chromium real cuando el plan lo marca; un paso omitido o ausente no pasa.
          case "$PLAN_PROTOTIPO" in
            true) test "$PASO_PROTOTIPO" = success ;;
            false) test "$PASO_PROTOTIPO" = skipped ;;
            *) exit 1 ;;
          esac
          # La app móvil exige JS, Android (build + emulador) e iOS (build + simulador): un skip obligatorio no pasa.
          test "$PLAN" = success
          case "$PLAN_MOBILE" in
            true)
              # Una sentencia por condición: bajo `bash -e` un `&&` intermedio que falla no aborta el script.
              test "$MOBILE" = success
              test "$ANDROID" = success
              test "$IOS" = success
              test "$IOS_BACKEND" = success
              ;;
            false)
              test "$MOBILE" = skipped
              test "$ANDROID" = skipped
              test "$IOS" = skipped
              test "$IOS_BACKEND" = skipped
              ;;
            *) exit 1 ;;
          esac
          test -n "$PLAN_UI"
          if test "$PLAN_UI" = '[]'; then test "$UI" = skipped; else test "$UI" = success; fi

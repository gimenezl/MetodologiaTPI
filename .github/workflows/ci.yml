name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    name: CI / rápido
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      db: ${{ steps.impact.outputs.db }}
      ui: ${{ steps.impact.outputs.ui }}
      mutations: ${{ steps.impact.outputs.mutations }}
      prototipo: ${{ steps.impact.outputs.prototipo }}
      prototipo_paso: ${{ steps.prototipo.outcome }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder-pruebas.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-solo-para-pruebas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/impact.mjs
      - run: npm ci
      - run: node --test scripts/ci/impact.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx playwright test --config=playwright.pure.config.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.smoke.config.ts
      # Prototipo EPT-96: contiene HTML/CSS/JS ejecutable; se recorre en Chromium real, no solo se verifican hashes.
      - name: Prototipo EPT-96 (navegación real)
        id: prototipo
        if: steps.impact.outputs.prototipo == 'true'
        timeout-minutes: 5
        run: node docs/parte3/EPT-96/pruebas/prototipo.mjs
  database:
    name: CI / contratos reales
    needs: fast
    if: needs.fast.outputs.db == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic'))
    uses: ./.github/workflows/local-tests.yml
    with:
      kind: db
      mutations: ${{ needs.fast.outputs.mutations == 'true' }}
  ui:
    name: CI / interfaz focal
    needs: fast
    if: needs.fast.outputs.ui != '[]' && needs.fast.outputs.ui != '' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic'))
    uses: ./.github/workflows/local-tests.yml
    with:
      kind: ui
      selection: ${{ needs.fast.outputs.ui }}
  # --- App móvil (EPT-102 + EPT-105) ---------------------------------------------------------------
  # El plan decide si el cambio toca `mobile/` o lo que la app copia de la web. Un PASS de Next web no prueba mobile:
  # con plan móvil el gate exige JS (tipos, lint, pruebas, bundles), build Android + ejecución en emulador y build iOS +
  # ejecución en simulador sobre el SHA exacto del PR.
  plan:
    name: CI / plan móvil
    if: ${{ !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.impact.outputs.mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/impact.mjs
  mobile:
    name: CI / móvil
    needs: plan
    if: needs.plan.outputs.mobile == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder-pruebas.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-solo-para-pruebas
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalación reproducible
        run: npm ci
      - name: Copia compartida sin deriva
        run: npm run compartido:check
      - name: Importaciones prohibidas y secretos
        run: npm run verificar:importaciones
      - name: Compatibilidad Expo
        run: npm run verificar:expo && npm run doctor
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Componentes, formulario, sesión, almacenamiento y transporte
        run: npm test
      - name: Bundle Android
        run: npm run bundle:android
      - name: Bundle iOS
        run: npm run bundle:ios
      - name: Aislamiento de los bundles exportados
        run: node scripts/verificar-importaciones.mjs --bundle dist/android --bundle dist/ios
  mobile-android:
    name: CI / móvil Android
    needs: plan
    if: needs.plan.outputs.mobile == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Presupuesto y progreso nativo
        run: |
          echo "EPT_NATIVE_DEADLINE=$(( $(date +%s) + 1680 ))" >> "$GITHUB_ENV"
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-movil-android/stages" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas de deadlines y descendientes
        run: |
          python3 scripts/ci/run-stage.test.py
          node --test mobile/scripts/stack-isolation.test.mjs
      - name: Instalar CLI Supabase aislada (2.117.0)
        run: python3 scripts/ci/run-stage.py --stage cli-install --seconds 90 -- bash scripts/ci/install-cli.sh --isolated
      - name: Iniciar proyecto Supabase local descartable
        run: node mobile/scripts/supabase-local.mjs start android
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Instalación y proyecto nativo
        working-directory: mobile
        run: |
          python3 ../scripts/ci/run-stage.py --stage android-deps --seconds 180 -- npm ci
          python3 ../scripts/ci/run-stage.py --stage android-prebuild --seconds 90 -- npx --no-install expo prebuild --platform android --no-install
      - name: Build Android (release de prueba, x86_64)
        working-directory: mobile/android
        run: |
          start=$(date +%s)
          python3 ../../scripts/ci/run-stage.py --stage android-build --seconds 720 -- ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace
          echo "duracion_build_segundos=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Localizar APK
        id: apk
        run: |
          apk=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          echo "ruta=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Instalar Maestro 2.11.0
        run: |
          curl --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Verificar Auth, roles, expiración y RLS con actores sintéticos
        run: python3 scripts/ci/run-stage.py --stage auth-integration --seconds 210 -- node mobile/scripts/integracion-auth-local.mjs
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar en emulador Android (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/ejecutar-android.sh ${{ steps.apk.outputs.ruta }}
      - name: Detener el stack local de pruebas
        if: always()
        run: node mobile/scripts/supabase-local.mjs stop
      - name: Sanear artifacts nativos
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-movil-android"
      - name: Subir evidencia Android
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movil-android-${{ github.sha }}
          path: |
            ${{ steps.apk.outputs.ruta }}
            ${{ runner.temp }}/evidencia-movil-android/stages/
            ${{ runner.temp }}/evidencia-movil-android/android-version.txt
            ${{ runner.temp }}/evidencia-movil-android/maestro-android/
          if-no-files-found: warn
          retention-days: 14
  mobile-ios:
    name: CI / móvil iOS
    needs: plan
    if: needs.plan.outputs.mobile == 'true' && !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic'))
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Presupuesto y progreso nativo
        run: |
          echo "EPT_NATIVE_DEADLINE=$(( $(date +%s) + 1680 ))" >> "$GITHUB_ENV"
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-movil-ios/stages" >> "$GITHUB_ENV"
          echo "EPT_IOS_EVIDENCE_DIR=$RUNNER_TEMP/evidencia-movil-ios" >> "$GITHUB_ENV"
      - name: Verificar toolchain iOS seleccionado antes del backend
        run: python3 scripts/ci/run-stage.py --stage ios-toolchain --seconds 20 -- python3 mobile/scripts/ios-simulator.py toolchain
      - name: Versiones de herramientas
        run: |
          python3 scripts/ci/run-stage.py --stage ios-version --seconds 15 -- xcodebuild -version
          node --version
      - name: Pruebas de deadlines y descendientes
        run: |
          python3 scripts/ci/run-stage.test.py
          node --test mobile/scripts/stack-isolation.test.mjs
          python3 scripts/ci/native-backend.test.py
          python3 mobile/scripts/ios-simulator.test.py
          node --test scripts/ci/install-native.test.mjs
      - name: Seleccionar simulador y arquitectura ARM64
        run: bash mobile/scripts/preparar-ios.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ env.EPT_IOS_TOOLCHAIN }}-Release-${{ hashFiles('mobile/package-lock.json', 'mobile/app.config.*', 'mobile/app.json', 'mobile/plugins/**', 'mobile/ios/Podfile.lock') }}
      - name: Caché de archivos oficiales inmutables (sin datos ni sesiones)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ept105-native-archives
          key: native-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/native-services.lock.json') }}
      - name: Backend ARM real y todas las migraciones (sin VM)
        run: |
          export EPT_NATIVE_BINARY_CACHE="$HOME/.cache/ept105-native-archives"
          python3 scripts/ci/native-backend.py start
      - name: Verificar Auth, roles, expiración y RLS con actores sintéticos
        run: python3 scripts/ci/run-stage.py --stage auth-integration --seconds 210 -- node mobile/scripts/integracion-auth-local.mjs
      - name: Instalación y proyecto nativo (incluye pods)
        working-directory: mobile
        run: |
          python3 ../scripts/ci/run-stage.py --stage ios-deps --seconds 120 -- npm ci
          python3 ../scripts/ci/run-stage.py --stage ios-prebuild-pods --seconds 240 -- npx --no-install expo prebuild --platform ios
      - name: Build iOS Release ARM64 para el simulador seleccionado
        run: bash mobile/scripts/compilar-ios.sh
      - name: Localizar aplicación
        id: app
        run: |
          app=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app"
          echo "ruta=$app" >> "$GITHUB_OUTPUT"
      - name: Instalar Maestro 2.11.0
        run: |
          curl --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Ejecutar en simulador iOS
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: bash mobile/scripts/ejecutar-ios.sh "${{ steps.app.outputs.ruta }}"
      - name: Empaquetar evidencia iOS saneada
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidencia-movil-ios"
          if [ -n "${{ steps.app.outputs.ruta }}" ]; then
            python3 scripts/ci/run-stage.py --stage cleanup-package --seconds 20 -- ditto -c -k --keepParent "${{ steps.app.outputs.ruta }}" "$RUNNER_TEMP/evidencia-movil-ios/aplicacion-ios-simulador.zip"
          fi
          python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-movil-ios"
      - name: Cerrar y eliminar únicamente el simulador de este intento
        if: always()
        run: python3 scripts/ci/run-stage.py --stage cleanup-ios-simulator --seconds 55 -- python3 mobile/scripts/ios-simulator.py cleanup
      - name: Detener únicamente workers nativos propios
        if: always()
        run: python3 scripts/ci/run-stage.py --stage cleanup-native --seconds 45 -- python3 scripts/ci/native-backend.py stop
      - name: Sanear artifacts nativos
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-movil-ios"
      - name: Subir evidencia iOS
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: movil-ios-${{ github.sha }}
          path: ${{ runner.temp }}/evidencia-movil-ios/
          if-no-files-found: warn
          retention-days: 14
  diagnostic-smoke:
    name: CI / diagnóstico de procesos Linux
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Conservar diagnóstico de pruebas Linux
        run: |
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-process-linux/stages" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidencia-process-linux/stages"
      - name: Supervisión POSIX con evidencia persistente
        run: |
          set -o pipefail
          python3 scripts/ci/run-stage.test.py 2>&1 | tee "$EPT_STAGE_LOG_DIR/process-tests-redacted.log"
      - run: python3 scripts/ci/native-backend.test.py
      - run: python3 mobile/scripts/ios-simulator.test.py
      - run: node --test scripts/ci/install-native.test.mjs
      - run: node --test mobile/scripts/stack-isolation.test.mjs
      - run: node --test --test-name-pattern='EPT-102|diagnóstico' scripts/ci/impact.test.mjs
      - name: Sanear evidencia Linux
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-process-linux"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diagnostico-procesos-linux-${{ github.sha }}
          path: ${{ runner.temp }}/evidencia-process-linux/
          if-no-files-found: warn
          retention-days: 14
  ios-infrastructure-diagnostic:
    name: CI / diagnóstico iOS build y Maestro
    needs: diagnostic-smoke
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic') }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      EPT_IOS_DIAGNOSTIC_PHASE: runtime
      EXPO_PUBLIC_API_BASE_URL: https://placeholder-pruebas.example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Presupuesto diagnóstico cerrado (runtime 3 minutos; full 28; job 30)
        run: |
          case "$EPT_IOS_DIAGNOSTIC_PHASE" in
            runtime) budget=180 ;;
            full) budget=1680 ;;
            *) echo 'Invalid iOS diagnostic phase'; exit 1 ;;
          esac
          echo "EPT_NATIVE_DEADLINE=$(( $(date +%s) + budget ))" >> "$GITHUB_ENV"
          echo "EPT_STAGE_LOG_DIR=$RUNNER_TEMP/evidencia-ios-infra/stages" >> "$GITHUB_ENV"
          echo "EPT_IOS_EVIDENCE_DIR=$RUNNER_TEMP/evidencia-ios-infra" >> "$GITHUB_ENV"
          printf 'head=%s\nmerge_ref=%s\n' '${{ github.event.pull_request.head.sha }}' '${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Verificar toolchain iOS seleccionado antes del backend
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: python3 scripts/ci/run-stage.py --stage ios-toolchain --seconds 20 -- python3 mobile/scripts/ios-simulator.py toolchain
      - name: Probar supervisión POSIX también en macOS
        run: |
          mkdir -p "$EPT_STAGE_LOG_DIR"
          set -o pipefail
          python3 scripts/ci/run-stage.test.py 2>&1 | tee "$EPT_STAGE_LOG_DIR/process-tests-redacted.log"
      - run: python3 scripts/ci/native-backend.test.py
      - run: python3 mobile/scripts/ios-simulator.test.py
      - run: node --test scripts/ci/install-native.test.mjs
      - name: Inventario SDK de solo lectura (una consulta; sin backend ni simulador)
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'runtime'
        run: python3 scripts/ci/run-stage.py --stage sdk-inventory --seconds 90 -- python3 mobile/scripts/ios-simulator.py inventory
      - name: Caché de archivos oficiales inmutables (sin datos ni sesiones)
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ept105-native-archives
          key: native-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/native-services.lock.json') }}
      - name: Backend ARM real y todas las migraciones (sin VM)
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: |
          export EPT_NATIVE_BINARY_CACHE="$HOME/.cache/ept105-native-archives"
          python3 scripts/ci/native-backend.py start
      - name: Contratos Auth reales y fixtures
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: python3 scripts/ci/run-stage.py --stage auth-integration --seconds 210 -- node mobile/scripts/integracion-auth-local.mjs
      - name: Seleccionar simulador y arquitectura ARM64
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: bash mobile/scripts/preparar-ios.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ env.EPT_IOS_TOOLCHAIN }}-Release-${{ hashFiles('mobile/package-lock.json', 'mobile/app.config.*', 'mobile/app.json', 'mobile/plugins/**', 'mobile/ios/Podfile.lock') }}
      - name: Instalación y proyecto nativo (incluye pods)
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        working-directory: mobile
        run: |
          python3 ../scripts/ci/run-stage.py --stage ios-deps --seconds 120 -- npm ci
          python3 ../scripts/ci/run-stage.py --stage ios-prebuild-pods --seconds 240 -- npx --no-install expo prebuild --platform ios
      - name: Build iOS Release ARM64 para el simulador seleccionado
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: bash mobile/scripts/compilar-ios.sh
      - name: Localizar aplicación
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        id: app
        run: |
          app=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$app"
          echo "ruta=$app" >> "$GITHUB_OUTPUT"
      - name: Instalar Maestro 2.11.0
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: |
          curl --connect-timeout 10 --max-time 60 -fsSL -o "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Ejecutar en simulador iOS
        if: env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: bash mobile/scripts/ejecutar-ios.sh "${{ steps.app.outputs.ruta }}"
      - name: Cerrar y eliminar únicamente el simulador de este intento
        if: always() && env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: python3 scripts/ci/run-stage.py --stage cleanup-ios-simulator --seconds 55 -- python3 mobile/scripts/ios-simulator.py cleanup
      - name: Limpiar únicamente workers nativos propios
        if: always() && env.EPT_IOS_DIAGNOSTIC_PHASE == 'full'
        run: python3 scripts/ci/run-stage.py --stage cleanup-native --seconds 45 -- python3 scripts/ci/native-backend.py stop
      - name: Sanear diagnóstico
        if: always()
        run: python3 scripts/ci/run-stage.py --sanitize-directory "$RUNNER_TEMP/evidencia-ios-infra"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diagnostico-ios-infra-${{ github.sha }}
          path: ${{ runner.temp }}/evidencia-ios-infra/
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: CI / gate
    if: always()
    needs: [fast, database, ui, plan, mobile, mobile-android, mobile-ios]
    runs-on: ubuntu-latest
    steps:
      - env:
          DIAGNOSTIC: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:ios-infrastructure-diagnostic') }}
          FAST: ${{ needs.fast.result }}
          DATABASE: ${{ needs.database.result }}
          UI: ${{ needs.ui.result }}
          PLAN_DB: ${{ needs.fast.outputs.db }}
          PLAN_UI: ${{ needs.fast.outputs.ui }}
          PLAN_MUTATIONS: ${{ needs.fast.outputs.mutations }}
          PLAN_PROTOTIPO: ${{ needs.fast.outputs.prototipo }}
          PASO_PROTOTIPO: ${{ needs.fast.outputs.prototipo_paso }}
          PLAN: ${{ needs.plan.result }}
          PLAN_MOBILE: ${{ needs.plan.outputs.mobile }}
          MOBILE: ${{ needs.mobile.result }}
          ANDROID: ${{ needs.mobile-android.result }}
          IOS: ${{ needs.mobile-ios.result }}
        run: |
          if [ "$DIAGNOSTIC" = true ]; then
            echo 'Diagnóstico incompleto para entrega: CI / gate debe fallar.'
            exit 1
          fi
          test "$FAST" = success
          case "$PLAN_MUTATIONS" in true|false) ;; *) exit 1 ;; esac
          case "$PLAN_DB" in
            true) test "$DATABASE" = success ;;
            false) test "$DATABASE" = skipped ;;
            *) exit 1 ;;
          esac
          # El prototipo EPT-96 se recorre en Chromium real cuando el plan lo marca; un paso omitido o ausente no pasa.
          case "$PLAN_PROTOTIPO" in
            true) test "$PASO_PROTOTIPO" = success ;;
            false) test "$PASO_PROTOTIPO" = skipped ;;
            *) exit 1 ;;
          esac
          # La app móvil exige JS, Android (build + emulador) e iOS (build + simulador): un skip obligatorio no pasa.
          test "$PLAN" = success
          case "$PLAN_MOBILE" in
            true)
              # Una sentencia por condición: bajo `bash -e` un `&&` intermedio que falla no aborta el script.
              test "$MOBILE" = success
              test "$ANDROID" = success
              test "$IOS" = success
              ;;
            false)
              test "$MOBILE" = skipped
              test "$ANDROID" = skipped
              test "$IOS" = skipped
              ;;
            *) exit 1 ;;
          esac
          test -n "$PLAN_UI"
          if test "$PLAN_UI" = '[]'; then test "$UI" = skipped; else test "$UI" = success; fi

name: CI
# CI pausado hasta terminar el proyecto: solo queda el check requerido por la protección de main.
# Las verificaciones completas siguen en ci-completo.yml (manual: Actions > CI completo > Run workflow).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    name: CI / gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI pausado; se verifica a mano."

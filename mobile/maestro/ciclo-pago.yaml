appId: org.educarparatransformar.app
name: Ciclo económico (1/2) - padre consulta cuotas, registra dos pagos y carga sus comprobantes
---
# EPT-119. El backend (Supabase + Next) es real y es el mismo que usa Dirección en la web. Los ítems son
# determinísticos: los fija ciclo-economico.mjs `preparar` y llegan por MAESTRO_CICLO_*.
- launchApp:
    clearState: true
- runFlow: ciclo-correo.yaml
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_CICLO_PASSWORD}
# En iOS el teclado tapa el botón: se oculta antes de tocarlo. El ingreso viaja por el túnel, así que se espera con plazo.
- hideKeyboard
- tapOn: 'Ingresar'
# iOS ofrece guardar la contraseña con un diálogo del sistema que tapa la app y la oculta del árbol de accesibilidad
# (visto en el run 40444677933: «Hijos vinculados» «no visible» con el diálogo encima). Se espera a cualquiera de los
# dos, se descarta el diálogo si apareció (en inglés o español) y recién entonces se exige la pantalla.
- extendedWaitUntil:
    visible: 'Hijos vinculados|Not Now|Ahora no'
    timeout: 60000
- tapOn:
    text: 'Not Now|Ahora no'
    optional: true
# El aviso «Save Password?» puede aparecer justo aquí y ocultar la pantalla (run 41269332950): si la espera falla, el
# reintento lo descarta y vuelve a esperar.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ciclo-descartar-guardado.yaml
      - extendedWaitUntil:
          visible: 'Hijos vinculados'
          timeout: 30000
- runFlow: ciclo-descartar-guardado.yaml
# El aviso del sistema «Save Password?» puede llegar tarde y bloquear esta espera (runs 41246543644 y 41252955570): si falla,
# el reintento lo descarta y vuelve a esperar. Solo se envuelven esperas idempotentes, nunca toques que cambian el estado.
- retry:
    maxRetries: 2
    commands:
      - runFlow: ciclo-descartar-guardado.yaml
      # Run 41375337250 (reintento): la app quedó en «Hijos vinculados» y nunca apareció «Pagar ítems». Tocar la pestaña
      # «Cuotas» de nuevo es idempotente (no cambia datos), por eso va dentro del reintento.
      - tapOn: 'Cuotas'
      - runFlow: ciclo-descartar-guardado.yaml
      - scrollUntilVisible:
          element:
            text: '.*Pagar ítems.*'
          direction: DOWN
          timeout: 20000
# Pago A (se aprobará desde la web).
- runFlow:
    file: ciclo-pagar-item.yaml
    env:
      CICLO_ITEM: ${MAESTRO_CICLO_ITEM_A}
      CICLO_NUMERO: ${MAESTRO_CICLO_NUMERO_A}
      CICLO_IMPORTE: ${MAESTRO_CICLO_IMPORTE_A}
      CICLO_TOTAL: ${MAESTRO_CICLO_TOTAL_A}
- scrollUntilVisible:
    element:
      text: 'Volver a las cuotas'
    direction: DOWN
    timeout: 15000
- tapOn: 'Volver a las cuotas'
# Pago B (se rechazará desde la web).
- runFlow:
    file: ciclo-pagar-item.yaml
    env:
      CICLO_ITEM: ${MAESTRO_CICLO_ITEM_B}
      CICLO_NUMERO: ${MAESTRO_CICLO_NUMERO_B}
      CICLO_IMPORTE: ${MAESTRO_CICLO_IMPORTE_B}
      CICLO_TOTAL: ${MAESTRO_CICLO_TOTAL_B}
- takeScreenshot: ciclo-pago-completado

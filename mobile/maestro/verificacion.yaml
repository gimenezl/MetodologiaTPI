appId: org.educarparatransformar.app
name: Acceso real por rol, persistencia y cierre
---
- launchApp:
    clearState: true
- assertVisible: 'Iniciar sesión'
# Credenciales sintéticas aleatorias de una identidad inexistente: el mensaje no debe revelar el resultado de Auth.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_INVALIDO_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_INVALIDO_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: '.*No se pudo iniciar sesión.*Revisá el correo y la contraseña.*'
- stopApp
- launchApp:
    clearState: true

# PADRE: login JWT real, sesión persistida entre procesos y cierre local.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_PADRE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_PADRE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Hijos vinculados'
- scrollUntilVisible:
    element:
      text: '.*Legajo:.*'
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: '.*Legajo:.*'
# HU6: consulta de cuotas del hijo con datos reales (RLS), estado con texto y detalle por ítems.
- tapOn: 'Cuotas'
- assertVisible: '.*Pendientes.*2.*'
- assertVisible: '.*Pagadas.*1.*'
- assertVisible: 'Estudiante'
# La pestaña Pagadas muestra la cuota saldada.
- tapOn: 'Pagadas.*'
- assertVisible: '.*Pagada.*'
- tapOn: 'Pendientes.*'
# La cuota vencida se destaca con texto; puede estar bajo el pliegue.
- scrollUntilVisible:
    element:
      text: '.*Vencida el.*'
    direction: DOWN
    timeout: 15000
- assertVisible: '.*Vencida el.*'
- tapOn:
    text: '.*Ver detalle.*'
    index: 0
- assertVisible: 'Conceptos'
- assertVisible: '.*Cuota.*'
- tapOn: 'Volver a las cuotas'
# HU8: selección de ítems, total calculado por el servidor y registro del pago pendiente de verificación
# con RPC y RLS reales (Android). El saldo y las pestañas no cambian hasta que se apruebe el pago.
- scrollUntilVisible:
    element:
      text: 'Pagar ítems'
    direction: UP
    timeout: 15000
- tapOn: 'Pagar ítems'
- assertVisible: 'Elegí los ítems a pagar'
- assertVisible: '.*Los ítems pagados o en verificación no se pueden seleccionar.*'
- tapOn:
    text: 'Cuota, Pendiente.*'
    index: 0
# El total queda bajo el pliegue: se baja hasta verlo. Lo calcula el servidor.
- scrollUntilVisible:
    element:
      text: '.*1 ítem seleccionado.*'
    direction: DOWN
    timeout: 15000
- assertVisible: '.*1 ítem seleccionado.*calculado por el sistema.*'
# Los datos bancarios cargan de forma asíncrona y agrandan la pantalla: primero se espera a que
# existan y recién después se baja hasta el botón, para que el diseño ya no cambie.
- scrollUntilVisible:
    element:
      text: '.*Datos de prueba.*'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'No se acepta pago en efectivo.'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Registrar pago'
    direction: DOWN
    timeout: 15000
- tapOn: 'Registrar pago'
- assertVisible: '.*Pago registrado: pendiente de verificación.*'
- scrollUntilVisible:
    element:
      text: '.*Código del pago.*'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Volver a las cuotas'
    direction: DOWN
    timeout: 15000
- tapOn: 'Volver a las cuotas'
- assertVisible: '.*Pendientes.*2.*'
- scrollUntilVisible:
    element:
      text: '.*pago en verificación.*'
    direction: DOWN
    timeout: 15000
- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Hijos vinculados'
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

# ESTUDIANTE: el acceso corresponde a su rol de base, no al user_metadata editable.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_ESTUDIANTE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_ESTUDIANTE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Mi información'
- assertVisible: 'Mi información académica'
- assertVisible:
    text: '.*Legajo:.*'
# HU6: el estudiante ve sus cuotas sin selector de otros alumnos ni acciones de pago.
- tapOn: 'Cuotas'
- assertVisible: '.*Pendientes.*2.*'
- assertNotVisible: 'Estudiante'
- assertNotVisible: '.*Pagar.*'
# El listado empuja la acción de cierre bajo el pliegue.
- scrollUntilVisible:
    element:
      text: 'Cerrar sesión'
    direction: DOWN
    timeout: 15000
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

# DOCENTE: rol autenticado pero móvil no soportado, con orientación web y sin menú móvil.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_DOCENTE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_DOCENTE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Continuá desde el sistema web'
- assertVisible: '.*Esta cuenta usa el sistema web.*'
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Iniciar sesión'

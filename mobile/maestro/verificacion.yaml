appId: org.educarparatransformar.app
name: Acceso real por rol, persistencia y cierre
---
- launchApp:
    clearState: true
- assertVisible: 'Iniciar sesión'
# Credenciales sintéticas aleatorias de una identidad inexistente: el mensaje no debe revelar el resultado de Auth.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_INVALIDO_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_INVALIDO_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: '.*No se pudo iniciar sesión.*Revisá el correo y la contraseña.*'
- stopApp
- launchApp:
    clearState: true

# PADRE: login JWT real, sesión persistida entre procesos y cierre local.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_PADRE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_PADRE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Hijos vinculados'
- scrollUntilVisible:
    element: 'Legajo:'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Legajo:'
- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Hijos vinculados'
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

# ESTUDIANTE: el acceso corresponde a su rol de base, no al user_metadata editable.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_ESTUDIANTE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_ESTUDIANTE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Acceso para estudiantes'
- assertVisible: 'Mi información académica'
- assertVisible: 'Legajo:'
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

# DOCENTE: rol autenticado pero móvil no soportado, con orientación web y sin menú móvil.
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_DOCENTE_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_DOCENTE_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Continuá desde el sistema web'
- assertVisible: '.*Esta cuenta usa el sistema web.*'
- tapOn: 'Cerrar sesión'
- assertVisible: 'Iniciar sesión'

- stopApp
- launchApp:
    clearState: false
- assertVisible: 'Iniciar sesión'

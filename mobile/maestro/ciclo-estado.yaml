appId: org.educarparatransformar.app
name: Ciclo económico (2/2) - la app refleja la aprobación y el rechazo decididos en la web
---
# EPT-119. Dirección ya decidió desde la web: A aprobado (con recibo) y B rechazado (con motivo). La app arranca
# de cero con la misma cuenta y lee el mismo estado: deuda = B + C, sin cambio por el rechazo.
- launchApp:
    clearState: true
- tapOn:
    id: 'correo'
- inputText: ${MAESTRO_CICLO_EMAIL}
- tapOn:
    id: 'contrasena'
- inputText: ${MAESTRO_CICLO_PASSWORD}
- tapOn: 'Ingresar'
- assertVisible: 'Hijos vinculados'
- swipe:
    from:
      id: 'pestanas'
    direction: LEFT
- swipe:
    from:
      id: 'pestanas'
    direction: LEFT
- swipe:
    from:
      id: 'pestanas'
    direction: LEFT
- tapOn:
    id: 'seccion-periodo'
- tapOn:
    id: 'periodo-desde'
- eraseText
- inputText: ${MAESTRO_CICLO_DESDE}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'periodo-hasta'
    direction: DOWN
    speed: 80
    visibilityPercentage: 100
    timeout: 15000
- tapOn:
    id: 'periodo-hasta'
- eraseText
- inputText: ${MAESTRO_CICLO_HASTA}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'periodo-consultar'
    direction: DOWN
    speed: 80
    visibilityPercentage: 100
    timeout: 15000
- tapOn:
    id: 'periodo-consultar'
# Estados del mismo pago que decidió Dirección.
- scrollUntilVisible:
    element:
      text: 'Aprobado'
    direction: DOWN
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Rechazado'
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      text: '.*Motivo del rechazo: Comprobante no corresponde al pago.*'
    direction: DOWN
    timeout: 15000
# El recibo es el del pago aprobado.
- scrollUntilVisible:
    element:
      id: 'recibo-descargar'
    direction: DOWN
    speed: 80
    visibilityPercentage: 100
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'recibo-descargar'
- extendedWaitUntil:
    visible: '.*recibo-.*\.pdf'
    timeout: 60000
- takeScreenshot: ciclo-recibo-menu-nativo
- back
- scrollUntilVisible:
    element:
      id: 'recibo-descargar'
    direction: DOWN
    speed: 80
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
# Saldo: el rechazo no reduce la deuda (38.900,25 + 51.000,00 = 89.900,25) y la reserva de B se liberó.
- scrollUntilVisible:
    element:
      id: 'pestanas'
    direction: UP
    timeout: 20000
- swipe:
    from:
      id: 'pestanas'
    direction: RIGHT
- tapOn:
    id: 'seccion-deuda'
- scrollUntilVisible:
    element:
      text: 'Total adeudado'
    direction: DOWN
    timeout: 20000
- assertVisible: 'ARS.89\.900,25'
- takeScreenshot: ciclo-deuda-final

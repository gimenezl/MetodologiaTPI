appId: org.educarparatransformar.app
name: Recuperación de contraseña en iOS (enlace y formularios, sin backend)
---
# EPT-106. Comprueba en el simulador el comportamiento NATIVO aplicable sin backend: el esquema
# educarparatransformar:// llega a la app, un enlace inválido o vencido no abre la recuperación y la solicitud
# valida el correo antes de llamar a Auth. NO prueba la recuperación completa (correo, canje y cambio reales),
# que corre en Android contra Supabase local.
- launchApp:
    clearState: true
- assertVisible: 'Iniciar sesión'
- tapOn: '¿Olvidaste tu contraseña?'
- assertVisible: 'Recuperar contraseña'
- tapOn:
    id: 'recuperar-correo'
- inputText: 'no-es-un-correo'
- tapOn: 'Enviar enlace'
- assertVisible: 'Ingresá un correo electrónico válido.'
- stopApp
# Enlace vencido informado por Auth: llega por el esquema y no abre el formulario de contraseña nueva.
- openLink: 'educarparatransformar://restablecer?error=access_denied&error_code=otp_expired&error_description=Email+link+is+invalid+or+has+expired'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Enlace no disponible'
    timeout: 20000
- assertVisible: '.*El enlace venció.*'
- assertNotVisible: 'Elegí una contraseña nueva'
- takeScreenshot: 02-enlace-vencido
- tapOn: 'Pedir un enlace nuevo'
- assertVisible: 'Recuperar contraseña'
# Un enlace hacia una ruta desconocida termina en el inicio de sesión, sin mostrar sus parámetros.
- stopApp
- openLink: 'educarparatransformar://desconocida?code=00000000-0000-0000-0000-000000000000'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 20000
- assertNotVisible: '.*00000000.*'
